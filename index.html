<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IdeaSpark</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>IdeaSpark</h1>
      <p class="subtitle">Generate fresh app ideas in one click.</p>

      <section class="card" aria-live="polite">
        <h2 id="idea-title">Ready to brainstorm?</h2>
        <p id="idea-description">Tap generate to get a new idea.</p>
      </section>

      <div class="controls">
        <button id="generate-btn" type="button">Generate idea</button>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
